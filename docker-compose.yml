services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskservice"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_create_tasks.up.sql:/docker-entrypoint-initdb.d/001_create_tasks.sql:ro
      - ./migrations/0002_add_frequency_to_tasks.up.sql:/docker-entrypoint-initdb.d/002_add_frequency.sql:ro
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_DSN: postgres://postgres:postgres@postgres:5432/taskservice?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app  # Maps local project folder to /app in container
    environment:
      # DATABASE_DSN: postgres://postgres:postgres@postgres:5432/taskservice?sslmode=disable
      # Детализация вывода
      # GODEBUG: "gctrace=1"  # Выводит информацию о GC
      GOTRACEBACK: "all"    # Подробный stack trace при панике
      # CGO_ENABLED: 1
      
      # Test flags
      TEST_FLAGS: "-v -cover -race -count=1 -failfast"

    # depends_on:
    #   postgres:
    #     condition: service_healthy
    profiles:
      - test

volumes:
  postgres_data:
